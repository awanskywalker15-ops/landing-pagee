<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Awan Player - Pemutar musik cloud-themed modern dengan desain glassmorphism premium. Nikmati melodi indah dalam suasana langit teduh.">
    <title>Awan Player - Cozy Cloud Music</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Main Style -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Background Animated Blobs/Clouds -->
    <div class="bg-decor">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <div class="cloud-decor c1"><i class="fa-solid fa-cloud"></i></div>
        <div class="cloud-decor c2"><i class="fa-solid fa-cloud"></i></div>
        <div class="cloud-decor c3"><i class="fa-solid fa-cloud"></i></div>
    </div>

    <!-- Main Container -->
    <main class="player-container">
        <div class="glass-card">
            
            <!-- Left Panel: Player Dashboard -->
            <section class="player-dashboard">
                <header class="app-header">
                    <div class="brand">
                        <i class="fa-solid fa-cloud-sun icon-brand"></i>
                        <h1>Awan Player</h1>
                    </div>
                    <span class="badge">Cozy Vibe</span>
                </header>

                <!-- Disk / Album Cover Cover -->
                <div class="cover-wrapper">
                    <div class="cover-glow" id="coverGlow"></div>
                    <div class="cover-art-container" id="coverContainer">
                        <img src="cover.png" alt="Cover Album Awan Player" class="cover-img" id="albumArt">
                    </div>
                </div>

                <!-- Track Info -->
                <div class="track-info">
                    <h2 class="track-title" id="currentTitle">Memuat Lagu...</h2>
                    <p class="track-artist" id="currentArtist">Memuat Artis...</p>
                    <div class="track-filename" id="currentFilename">m1.mp3</div>
                </div>

                <!-- Progress Bar -->
                <div class="progress-container">
                    <div class="progress-slider" id="progressSlider">
                        <div class="progress-bar" id="progressBar"></div>
                        <div class="progress-thumb" id="progressThumb"></div>
                    </div>
                    <div class="time-info">
                        <span id="currentTime">00:00</span>
                        <span id="totalTime">00:00</span>
                    </div>
                </div>

                <!-- Controls -->
                <div class="player-controls">
                    <button class="btn-control" id="btnShuffle" title="Acak Lagu">
                        <i class="fa-solid fa-shuffle"></i>
                    </button>
                    <button class="btn-control btn-secondary" id="btnPrev" title="Lagu Sebelumnya">
                        <i class="fa-solid fa-backward-step"></i>
                    </button>
                    <button class="btn-control btn-play" id="btnPlay" title="Putar">
                        <i class="fa-solid fa-play" id="playIcon"></i>
                    </button>
                    <button class="btn-control btn-secondary" id="btnNext" title="Lagu Selanjutnya">
                        <i class="fa-solid fa-forward-step"></i>
                    </button>
                    <button class="btn-control" id="btnRepeat" title="Ulangi Lagu">
                        <i class="fa-solid fa-repeat"></i>
                    </button>
                </div>

                <!-- Volume Control -->
                <div class="volume-container">
                    <button class="btn-volume" id="btnMute" title="Bisukan">
                        <i class="fa-solid fa-volume-high" id="volumeIcon"></i>
                    </button>
                    <div class="volume-slider" id="volumeSliderContainer">
                        <div class="volume-bar" id="volumeBar"></div>
                        <input type="range" class="volume-input" id="volumeInput" min="0" max="1" step="0.01" value="0.8">
                    </div>
                </div>
            </section>

            <!-- Right Panel: Interactive Playlist -->
            <section class="playlist-panel">
                <div class="playlist-header">
                    <h2>Daftar Putar</h2>
                    <span class="song-count" id="trackCount">6 Lagu</span>
                </div>
                
                <div class="playlist-songs" id="playlistSongs">
                    <!-- Song items will be injected by JavaScript -->
                    <div class="loading-playlist">
                        <i class="fa-solid fa-circle-notch fa-spin"></i> Memuat daftar lagu...
                    </div>
                </div>

                <!-- App Footer Info -->
                <footer class="app-footer">
                    <p><i class="fa-regular fa-copyright"></i> 2026 Awan Player. Dibuat dengan cinta.</p>
                </footer>
            </section>

        </div>
    </main>

    <!-- JS Logic -->
    <script src="app.js"></script>
</body>
</html>
